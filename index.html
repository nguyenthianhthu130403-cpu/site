<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Máy tính phương pháp cấp 2 (Newton-Raphson)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9fafb;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #1e40af;
    }
    form {
      max-width: 600px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.1);
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type=text], input[type=number] {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .error {
      background-color: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      margin: 0 auto 20px auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.1);
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      text-align: center;
      font-size: 0.9rem;
    }
    th {
      background-color: #f3f4f6;
      color: #374151;
      font-weight: 600;
    }
    caption {
      caption-side: top;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 10px 0;
      color: #1e40af;
    }
    .result-root {
      max-width: 600px;
      margin: 0 auto 20px auto;
      background-color: #d1fae5;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
    }
    .note {
      max-width: 600px;
      margin: 0 auto;
      font-size: 0.85rem;
      color: #6b7280;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
</head>
<body>
  <h1>Máy tính phương pháp cấp 2 (Newton-Raphson)</h1>
  <form id="newtonForm">
    <label for="expression">f(x)</label>
    <input type="text" id="expression" name="expression" value="x^2 - 2" placeholder="Ví dụ: x^2 - 2 hoặc sin(x) - x/2" required />

    <label for="x0">Giá trị ban đầu x₀</label>
    <input type="number" id="x0" name="x0" value="1" step="any" required />

    <label for="tolerance">Sai số cho phép</label>
    <input type="number" id="tolerance" name="tolerance" value="0.0001" step="any" min="0" required />

    <label for="maxIter">Số lần lặp tối đa</label>
    <input type="number" id="maxIter" name="maxIter" value="20" min="1" required />

    <button type="submit">Tính toán</button>
  </form>

  <div id="errorMsg" class="error" style="display:none;"></div>

  <table id="resultTable" style="display:none;">
    <caption>Kết quả lặp</caption>
    <thead>
      <tr>
        <th>Lần</th>
        <th>x</th>
        <th>f(x)</th>
        <th>Sai số</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="rootResult" class="result-root" style="display:none;"></div>

  <p class="note">
    Ghi chú: Đây là phương pháp hội tụ cấp 2 (Newton-Raphson). Kết quả phụ thuộc vào giá trị ban đầu x₀, đạo hàm và dạng của hàm số.
  </p>

  <script>
    const form = document.getElementById('newtonForm');
    const errorMsg = document.getElementById('errorMsg');
    const resultTable = document.getElementById('resultTable');
    const resultBody = resultTable.querySelector('tbody');
    const rootResult = document.getElementById('rootResult');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      errorMsg.style.display = 'none';
      resultTable.style.display = 'none';
      rootResult.style.display = 'none';
      resultBody.innerHTML = '';

      const expr = form.expression.value.trim();
      const x0 = parseFloat(form.x0.value);
      const tol = parseFloat(form.tolerance.value);
      const maxIter = parseInt(form.maxIter.value, 10);

      if (!expr) {
        showError('Vui lòng nhập biểu thức f(x).');
        return;
      }
      if (isNaN(x0)) {
        showError('Giá trị khởi tạo x₀ không hợp lệ.');
        return;
      }
      if (isNaN(tol) || tol <= 0) {
        showError('Sai số phải là số dương.');
        return;
      }
      if (isNaN(maxIter) || maxIter < 1) {
        showError('Số lần lặp tối đa phải là số nguyên lớn hơn 0.');
        return;
      }

      let derivativeNode;
      try {
        derivativeNode = math.derivative(expr, 'x');
      } catch (e) {
        showError('Biểu thức không hợp lệ. Ví dụ: x^3 - 5*x + 1 hoặc sin(x) - x/2');
        return;
      }

      let currentX = x0;
      let converged = false;

      for (let i = 1; i <= maxIter; i++) {
        let fx, dfx;
        try {
          fx = math.evaluate(expr, { x: currentX });
          dfx = derivativeNode.evaluate({ x: currentX });
        } catch (e) {
          showError('Lỗi khi tính toán f(x) hoặc đạo hàm tại x = ' + currentX.toFixed(6));
          return;
        }

        if (dfx === 0) {
          showError('Đạo hàm bằng 0 tại x = ' + currentX.toFixed(6) + '. Không thể tiếp tục Newton. Hãy thử x₀ khác.');
          return;
        }

        const nextX = currentX - fx / dfx;
        const error = Math.abs(nextX - currentX);

        addRow(i, nextX, fx, i === 1 ? null : error);

        currentX = nextX;

        if (error < tol) {
          converged = true;
          showRoot(nextX);
          break;
        }

        if (i === maxIter) {
          showRoot(nextX);
        }
      }

      if (!converged && resultBody.children.length === 0) {
        showError('Không thể tìm nghiệm với các tham số đã cho.');
      } else {
        resultTable.style.display = '';
      }
    });

    function addRow(iteration, x, fx, error) {
      const tr = document.createElement('tr');
      const tdIter = document.createElement('td');
      tdIter.textContent = iteration.toString();
      const tdX = document.createElement('td');
      tdX.textContent = x.toFixed(6);
      const tdFx = document.createElement('td');
      tdFx.textContent = Math.abs(fx) < 1e-15 ? '0' : fx.toFixed(6);
      const tdError = document.createElement('td');
      tdError.textContent = error === null ? '—' : error.toExponential(2);

      tr.appendChild(tdIter);
      tr.appendChild(tdX);
      tr.appendChild(tdFx);
      tr.appendChild(tdError);

      resultBody.appendChild(tr);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = '';
    }

    function showRoot(root) {
      rootResult.textContent = 'Nghiệm gần đúng: ' + root.toFixed(6);
      rootResult.style.display = '';
    }
  </script>
</body>
</html>
